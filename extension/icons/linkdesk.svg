<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Firefox brand palette (yellow → orange → pink → purple) on Linkdesk's own desktop shape.
       Deliberately no flame, fox or globe: it must not look like the Firefox logo. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd4f"/>
      <stop offset="0.35" stop-color="#ff7139"/>
      <stop offset="0.7" stop-color="#e31587"/>
      <stop offset="1" stop-color="#9059ff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="3" width="28" height="22" rx="4" fill="url(#screen)"/>
  <rect x="2" y="21" width="28" height="4" rx="1" fill="#20123a" opacity=".35"/>
  <rect x="6" y="7" width="6" height="6" rx="1.5" fill="#fff"/>
  <rect x="14" y="7" width="6" height="6" rx="1.5" fill="#fff"/>
  <rect x="6" y="14" width="6" height="5" rx="1.5" fill="#fff" opacity=".8"/>
  <rect x="11" y="27" width="10" height="2" rx="1" fill="#9059ff"/>
</svg>

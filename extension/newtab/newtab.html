<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <!-- Linkdesk's own icon. Not Firefox's branding icon: Mozilla's trademark guidelines require an
       add-on's icon and graphics to be free of Mozilla marks (see COMPLIANCE.md). -->
  <link rel="icon" href="../icons/linkdesk.svg">
  <!-- Before the stylesheets, so the storage read doesn't wait for CSS. -->
  <script src="boot.js"></script>
  <!-- Painted before anything loads, so a new tab never flashes white. -->
  <style>html, body { background: light-dark(#f9f9fb, #1c1b22); }</style>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="newtab.css">
  <!-- Fetch the whole module graph in parallel instead of one import at a time. -->
  <link rel="modulepreload" href="../lib/url.js">
  <link rel="modulepreload" href="../lib/grid.js">
  <link rel="modulepreload" href="../lib/model.js">
  <link rel="modulepreload" href="../lib/image.js">
  <link rel="modulepreload" href="../shared/ui.js">
  <link rel="modulepreload" href="../shared/importers.js">
  <link rel="modulepreload" href="editor.js">
  <script type="module" src="newtab.js"></script>
</head>
<body>
  <main id="desktop" tabindex="-1" aria-label="Desktop">
    <div id="grid" role="group" aria-label="Links"></div>
    <div id="dots" aria-hidden="true"></div>
    <div id="drop-target" aria-hidden="true" hidden></div>
    <div id="band" aria-hidden="true" hidden></div>

    <section id="empty" hidden aria-labelledby="empty-title">
      <h1 id="empty-title">Your desktop is empty</h1>
      <p class="note">Pin the sites you open most.</p>
      <div class="empty-actions">
        <button type="button" class="primary" data-action="add">Add a link</button>
        <button type="button" data-action="import-top">Import most visited sites</button>
        <button type="button" data-action="import-bookmarks">Import bookmarks…</button>
        <button type="button" data-action="import-file">Import file…</button>
      </div>
      <hr>
      <label class="check"><input type="checkbox" id="empty-site-access"> Fetch site icons and titles</label>
      <p class="note">Right-click the desktop or paste a link here at any time.</p>
    </section>
  </main>

  <footer id="taskbar">
    <button type="button" id="settings-button" class="ghost" aria-label="Settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5Zm0 3.75a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Zm6.17-2.05-1.12-.3a5.1 5.1 0 0 0-.4-.97l.58-1a.63.63 0 0 0-.1-.76l-.95-.95a.63.63 0 0 0-.76-.1l-1 .58a5.1 5.1 0 0 0-.97-.4l-.3-1.12A.63.63 0 0 0 8.55 1.7h-1.1a.63.63 0 0 0-.6.47l-.3 1.12a5.1 5.1 0 0 0-.97.4l-1-.58a.63.63 0 0 0-.76.1l-.95.95a.63.63 0 0 0-.1.76l.58 1a5.1 5.1 0 0 0-.4.97l-1.12.3a.63.63 0 0 0-.47.6v1.1c0 .29.19.53.47.6l1.12.3c.1.34.23.66.4.97l-.58 1a.63.63 0 0 0 .1.76l.95.95c.2.2.51.24.76.1l1-.58c.31.17.63.3.97.4l.3 1.12c.07.28.31.47.6.47h1.1c.29 0 .53-.19.6-.47l.3-1.12c.34-.1.66-.23.97-.4l1 .58c.25.14.56.1.76-.1l.95-.95c.2-.2.24-.51.1-.76l-.58-1c.17-.31.3-.63.4-.97l1.12-.3a.63.63 0 0 0 .47-.6v-1.1a.63.63 0 0 0-.47-.6Z"/></svg>
    </button>
    <div id="clock" aria-live="off"><span id="time"></span><span id="date"></span></div>
  </footer>

  <!-- Announced through #live, so no role here (avoids reading it twice). -->
  <div id="toast" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo" class="link" hidden>Undo</button>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form" novalidate>
      <h2 id="editor-title">Edit link</h2>
      <div class="field">
        <label for="editor-url">URL</label>
        <input type="url" id="editor-url" required autocomplete="off" spellcheck="false" placeholder="https://example.com">
      </div>
      <p id="editor-url-error" class="error field-note" hidden>Enter a web address starting with http or https.</p>
      <div class="field">
        <label for="editor-name">Name</label>
        <input type="text" id="editor-name" maxlength="200" autocomplete="off">
      </div>
      <fieldset class="field icon-field">
        <legend>Icon</legend>
        <div id="editor-preview" class="preview"></div>
        <div class="icon-options">
          <div class="icon-option">
            <label><input type="radio" name="icon-kind" value="site" checked> Site icon</label>
            <button type="button" id="editor-refresh">Refresh</button>
          </div>
          <div class="icon-option">
            <label><input type="radio" name="icon-kind" value="upload"> Upload</label>
            <button type="button" id="editor-choose">Choose…</button>
            <input type="file" id="editor-file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/x-icon,image/vnd.microsoft.icon" hidden>
          </div>
          <div class="icon-option">
            <label><input type="radio" name="icon-kind" value="letter"> Letter</label>
            <input type="text" id="editor-letter" class="letter-input" maxlength="16" aria-label="Tile letters (up to 2)">
            <div id="editor-colors"></div>
          </div>
        </div>
      </fieldset>
      <p id="editor-icon-note" class="note field-note" role="status" hidden><span id="editor-icon-note-text"></span> <button type="button" id="editor-open-settings" class="link" hidden>Open Settings</button></p>
      <p id="editor-dup" class="note field-note" hidden>ⓘ Already on your desktop</p>
      <div class="editor-buttons">
        <button type="button" id="editor-delete" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
